[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synchec"
version = "1.0.0"
description = "Markerless spatio-temporal hand-eye calibration"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-NonCommercial-Research"
license-files = ["LICENSE"]
authors = [{name = "Zhengdong Hong"}]
dependencies = [
    "torch>=2.7",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "opencv-python>=4.10,<5",
    "trimesh>=4.0",
    "pycollada>=0.8",
]

[project.urls]
Repository = "https://github.com/hongzhengdong/SyncHeC"

[tool.setuptools.packages.find]
include = ["synchec*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
